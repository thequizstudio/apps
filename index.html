<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Catalog — Trivia Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1e3a2f;
    --bg-dark: #16281f;
    --card: #f0e6c4;
    --card-shadow: #0f1a14;
    --rule: #b0493f;
    --ink: #211d13;
    --ink-soft: #6b5f3f;
    --chalk: #ece3c9;
    --chalk-dim: #a9b8ac;
    --correct: #2f6b4a;
    --incorrect: #a6403a;
    --focus: #d9c26a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse at 50% -10%, #2a4b3c 0%, var(--bg) 55%, var(--bg-dark) 100%);
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 48px 20px 64px;
  }

  .masthead {
    text-align: center;
    margin-bottom: 34px;
  }

  .masthead .kicker {
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--chalk-dim);
    margin: 0 0 6px;
  }

  .masthead h1 {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0;
    color: var(--chalk);
  }

  .masthead h1 span {
    color: var(--focus);
  }

  .tally {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--chalk-dim);
    margin-top: 10px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 620px;
  }

  .card {
    position: relative;
    background: var(--card);
    color: var(--ink);
    border-radius: 3px;
    padding: 38px 34px 30px;
    transform: rotate(-0.6deg);
    box-shadow:
      0 2px 0 rgba(0,0,0,0.05),
      0 22px 40px -18px var(--card-shadow),
      0 2px 6px rgba(0,0,0,0.25);
    background-image:
      linear-gradient(var(--card), var(--card)),
      repeating-linear-gradient(
        transparent, transparent 27px,
        rgba(160,120,90,0.14) 27px, rgba(160,120,90,0.14) 28px
      );
  }

  .card::before {
    content: "";
    position: absolute;
    top: 30px;
    left: 14px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--bg-dark);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.08);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 10px;
    margin: 0 0 22px 30px;
  }

  .card-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }

  .card-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .clue {
    font-family: 'Space Mono', monospace;
    font-size: 19px;
    line-height: 1.6;
    margin: 0 0 8px 30px;
    min-height: 96px;
  }

  .clue .freq {
    font-size: 14px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  form.answer-row {
    display: flex;
    gap: 10px;
    margin: 26px 0 4px 30px;
  }

  .answer-row input[type="text"] {
    flex: 1;
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    border: 2px solid var(--ink);
    border-radius: 2px;
    background: #fffdf5;
    color: var(--ink);
  }

  .answer-row input[type="text"]:focus {
    outline: none;
    border-color: var(--rule);
    box-shadow: 0 0 0 3px rgba(176,73,63,0.18);
  }

  .answer-row input[type="text"]:disabled {
    background: #e8ddc0;
    color: var(--ink-soft);
  }

  button {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 20px;
    border-radius: 2px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--card);
    cursor: pointer;
  }

  button:hover { background: #3a331f; }

  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 1px;
  }

  button.secondary {
    background: transparent;
    color: var(--ink);
  }

  button.secondary:hover { background: rgba(0,0,0,0.06); }

  button:disabled {
    opacity: 0.45;
    cursor: default;
  }

  .feedback {
    margin: 6px 0 0 30px;
    min-height: 78px;
  }

  .feedback .answer-line {
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    margin-top: 10px;
  }

  .feedback .answer-line strong { font-weight: 600; }

  .stamp {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.06em;
    padding: 6px 16px;
    border: 3px solid currentColor;
    border-radius: 4px;
    transform: rotate(-4deg) scale(0.85);
    opacity: 0;
    animation: stamp-in 0.22s ease-out forwards;
  }

  .stamp.correct { color: var(--correct); }
  .stamp.incorrect { color: var(--incorrect); }

  @keyframes stamp-in {
    0% { opacity: 0; transform: rotate(-4deg) scale(1.5); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: rotate(-4deg) scale(0.85); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp { animation: none; opacity: 1; transform: rotate(-4deg) scale(0.85); }
  }

  .next-row {
    margin: 20px 0 0 30px;
  }

  footer {
    margin-top: 34px;
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    color: var(--chalk-dim);
    text-align: center;
    max-width: 480px;
  }

  footer a { color: var(--chalk-dim); }

  @media (max-width: 480px) {
    .card { padding: 30px 20px 24px; }
    .card-top, .clue, form.answer-row, .feedback, .next-row { margin-left: 18px; margin-right: 4px; }
    .answer-row { flex-direction: column; }
    .clue { font-size: 17px; }
  }
</style>
</head>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('qa-data').textContent);

  const clueEl = document.getElementById('clue-text');
  const cardNumEl = document.getElementById('card-num');
  const form = document.getElementById('answer-form');
  const input = document.getElementById('answer-input');
  const checkBtn = document.getElementById('check-btn');
  const nextBtn = document.getElementById('next-btn');
  const feedbackEl = document.getElementById('feedback');
  const tallyEl = document.getElementById('tally');

  let asked = 0;
  let correct = 0;
  let current = null;
  let recentIdx = [];

  const ARTICLES = /^(a|an|the)\s+/i;

  function normalize(s) {
    return s
      .toLowerCase()
      .replace(/["""'']/g, '')
      .replace(/[.,!?;:]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(ARTICLES, '');
  }

  function isCorrect(userText, responseText) {
    const u = normalize(userText);
    if (!u) return false;
    const r = normalize(responseText);
    if (u === r) return true;

    // credit a last-name-only or last-word-only answer for multi-word responses
    const rWords = r.split(' ');
    if (rWords.length > 1) {
      const last = rWords[rWords.length - 1];
      if (last.length >= 3 && u === last) return true;
    }
    return false;
  }

  function pickNext() {
    let idx;
    do {
      idx = Math.floor(Math.random() * DATA.length);
    } while (DATA.length > 5 && recentIdx.includes(idx));
    recentIdx.push(idx);
    if (recentIdx.length > 25) recentIdx.shift();
    return idx;
  }

  function showQuestion() {
    const idx = pickNext();
    current = DATA[idx];
    clueEl.innerHTML = escapeHtml(current.clue) +
      ' <span class="freq">[' + current.frequency + ']</span>';
    cardNumEl.textContent = 'No. ' + String(idx).padStart(6, '0');
    feedbackEl.innerHTML = '';
    input.value = '';
    input.disabled = false;
    checkBtn.disabled = false;
    nextBtn.disabled = true;
    input.focus();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"]/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
    }[c]));
  }

  function submitAnswer(e) {
    e.preventDefault();
    if (input.disabled) return;
    const userAnswer = input.value;
    const ok = isCorrect(userAnswer, current.response);

    asked++;
    if (ok) correct++;
    tallyEl.textContent = asked + ' asked · ' + correct + ' correct';

    input.disabled = true;
    checkBtn.disabled = true;
    nextBtn.disabled = false;

    feedbackEl.innerHTML =
      '<span class="stamp ' + (ok ? 'correct' : 'incorrect') + '">' +
      (ok ? 'CORRECT' : 'INCORRECT') + '</span>' +
      '<div class="answer-line">Answer: <strong>' + escapeHtml(current.response) + '</strong></div>';

    nextBtn.focus();
  }

  form.addEventListener('submit', submitAnswer);
  nextBtn.addEventListener('click', showQuestion);

  showQuestion();
})();
</script>
